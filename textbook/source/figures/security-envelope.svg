<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img"><ns0:title>二つの相手行動に対する利得と最悪時の保証</ns0:title><ns0:rect width="100%" height="100%" fill="white" /><ns0:style>text{font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;fill:#173752;font-size:19px}.title{font-size:24px;font-weight:700}.small{font-size:16px}.line{stroke:#53758b;stroke-width:2;fill:none;marker-end:url(#arrow)}.box{fill:#edf5fa;stroke:#51788e;stroke-width:1.5}</ns0:style><ns0:defs><ns0:marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:path d="M0 0 L8 4 L0 8Z" fill="#53758b" /></ns0:marker></ns0:defs><ns0:text x="25" y="35" class="title" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="24" font-weight="700">低い方の利得を、最も高くする</ns0:text><ns0:path d="M95 540H645" stroke="#dbe4ec" /><ns0:text x="80" y="546" class="small" text-anchor="end" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">-2</ns0:text><ns0:path d="M95 465H645" stroke="#dbe4ec" /><ns0:text x="80" y="471" class="small" text-anchor="end" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">-1</ns0:text><ns0:path d="M95 390H645" stroke="#dbe4ec" /><ns0:text x="80" y="396" class="small" text-anchor="end" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">0</ns0:text><ns0:path d="M95 315H645" stroke="#dbe4ec" /><ns0:text x="80" y="321" class="small" text-anchor="end" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">1</ns0:text><ns0:path d="M95 240H645" stroke="#dbe4ec" /><ns0:text x="80" y="246" class="small" text-anchor="end" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">2</ns0:text><ns0:text x="95" y="568" class="small" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">0</ns0:text><ns0:text x="232.5" y="568" class="small" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">0.25</ns0:text><ns0:text x="370.0" y="568" class="small" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">0.5</ns0:text><ns0:text x="507.5" y="568" class="small" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">0.75</ns0:text><ns0:text x="645" y="568" class="small" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">1</ns0:text><ns0:text x="30" y="75" class="small" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">利得（評価点）</ns0:text><ns0:path d="M95 315L645 465" stroke="#267ba0" stroke-width="3" fill="none" /><ns0:path d="M95 540L645 240" stroke="#b56b24" stroke-width="3" stroke-dasharray="9 5" fill="none" /><ns0:path d="M95 540L370.0 390L645 465" stroke="#173752" stroke-width="6" fill="none" /><ns0:circle cx="370.0" cy="390" r="7" fill="#c32351" /><ns0:text x="120" y="110" class="small" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">防御された場合：1 − 2p</ns0:text><ns0:text x="120" y="139" class="small" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">仕掛けられた場合：4p − 2（破線）</ns0:text><ns0:text x="120" y="168" class="small" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">太線：相手が選べる低い方の利得</ns0:text><ns0:text x="400" y="460" class="small" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">p = 0.5、保証は0点</ns0:text><ns0:text x="380" y="606" class="small" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">自分が攻撃を選ぶ確率 p（残りは待機）</ns0:text></ns0:svg>
