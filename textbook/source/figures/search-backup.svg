<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img"><title>固定相手の平均と最悪の相手への評価で異なる選択</title><rect width="100%" height="100%" fill="white" /><style>text{font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;fill:#173752;font-size:19px}.title{font-size:24px;font-weight:700}.small{font-size:16px}.line{stroke:#53758b;stroke-width:2;fill:none;marker-end:url(#arrow)}.box{fill:#edf5fa;stroke:#51788e;stroke-width:1.5}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#53758b" /></marker></defs><text x="25" y="38" class="title" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="24" font-weight="700">相手をどう集約するかで、選ぶ手が変わる</text><rect class="box" x="240" y="70" width="280" height="58" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="380.0" y="99" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">現在の局面</text><path class="line" d="M310 128 L200 173" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path class="line" d="M450 128 L560 173" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect class="box" x="60" y="180" width="280" height="60" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="200.0" y="209" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">攻撃</text><rect class="box" x="420" y="180" width="280" height="60" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="560.0" y="209" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">交代</text><rect class="box" x="60" y="275" width="280" height="88" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="200.0" y="304" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">相手の手1 → 0.90</text><text x="200.0" y="332" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">相手の手2 → 0.10</text><rect class="box" x="420" y="275" width="280" height="88" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="560.0" y="304" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">相手の手1 → 0.55</text><text x="560.0" y="332" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">相手の手2 → 0.45</text><path class="line" d="M200 240V268" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path class="line" d="M560 240V268" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect class="box" x="60" y="397" width="280" height="86" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="200.0" y="426" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">80%：20%の平均 → 0.74</text><text x="200.0" y="454" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">最悪の相手の手 → 0.10</text><rect class="box" x="420" y="397" width="280" height="86" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="560.0" y="426" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">80%：20%の平均 → 0.53</text><text x="560.0" y="454" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">最悪の相手の手 → 0.45</text><text x="30" y="526" class="small" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">固定相手の平均：攻撃を選ぶ ／ 最悪応答：交代を選ぶ</text><text x="30" y="554" class="small" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">数値は架空の期待評価。乱数は平均済み、即時報酬0・割引1。</text><text x="30" y="578" class="small" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">同時行動の混合戦略による評価は、この純粋な比較とは別。</text></svg>