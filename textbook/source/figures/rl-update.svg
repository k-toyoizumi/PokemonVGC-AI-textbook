<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" role="img"><title>経験・価値の推定・方策更新を繰り返す</title><rect width="100%" height="100%" fill="white"/><text x="25" y="38" font-size="24" fill="#173752" font-family="sans-serif">経験・価値の推定・方策更新を繰り返す</text><rect x="35" y="70" width="690" height="62" rx="10" fill="#edf5fa" stroke="#51788e"/><text x="60" y="108" font-size="21" font-family="sans-serif" fill="#173752">旧方策で対戦 → 履歴・行動・報酬を保存</text><path d="M380 134v26l-6 -8m6 8l6 -8" fill="none" stroke="#51788e" stroke-width="2"/><rect x="35" y="166" width="690" height="62" rx="10" fill="#edf5fa" stroke="#51788e"/><text x="60" y="204" font-size="21" font-family="sans-serif" fill="#173752">収益と価値から、相対的な行動の良さを推定</text><path d="M380 230v26l-6 -8m6 8l6 -8" fill="none" stroke="#51788e" stroke-width="2"/><rect x="35" y="262" width="690" height="62" rx="10" fill="#edf5fa" stroke="#51788e"/><text x="60" y="300" font-size="21" font-family="sans-serif" fill="#173752">旧方策に対する確率比を使って方策を更新</text><path d="M380 326v26l-6 -8m6 8l6 -8" fill="none" stroke="#51788e" stroke-width="2"/><rect x="35" y="358" width="690" height="62" rx="10" fill="#edf5fa" stroke="#51788e"/><text x="60" y="396" font-size="21" font-family="sans-serif" fill="#173752">更新後の方策で、新たな対戦経験を集める</text><text x="25" y="514" font-size="16" font-family="sans-serif" fill="#173752">模式図：最適化回数・相手の更新は省略。更新は性能向上の保証ではない。</text></svg>