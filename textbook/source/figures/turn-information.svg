<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570" role="img"><title>完全な状態と各自の情報、同時の判断、次状態の区別</title><rect width="100%" height="100%" fill="white" /><style>text{font-family:"Noto Sans CJK JP","Noto Sans JP",sans-serif;fill:#173752;font-size:19px}.title{font-size:24px;font-weight:700}.small{font-size:16px}.line{stroke:#53758b;stroke-width:2;fill:none;marker-end:url(#arrow)}.box{fill:#edf5fa;stroke:#51788e;stroke-width:1.5}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#53758b" /></marker></defs><text x="30" y="39" class="title" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="24" font-weight="700">状態と観測を分ける</text><rect class="box" x="225" y="65" width="310" height="62" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="380.0" y="94" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">完全な状態：公開・非公開情報</text><path class="line" d="M280 127 L180 176" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path class="line" d="M480 127 L580 176" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect class="box" x="50" y="180" width="280" height="84" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="190.0" y="209" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">自分の観測・履歴</text><text x="190.0" y="237" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">自分が利用できる情報</text><rect class="box" x="430" y="180" width="280" height="84" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="570.0" y="209" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">相手の観測・履歴</text><text x="570.0" y="237" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">相手が利用できる情報</text><path class="line" d="M190 264 L190 306" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path class="line" d="M570 264 L570 306" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect class="box" x="75" y="312" width="230" height="60" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="190.0" y="341" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">自分の結合行動</text><rect class="box" x="455" y="312" width="230" height="60" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="570.0" y="341" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">相手の結合行動</text><text x="380" y="293" class="small" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">互いの今回の選択を見る前に判断</text><path class="line" d="M190 372 L280 417" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path class="line" d="M570 372 L480 417" stroke="#53758b" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect class="box" x="170" y="422" width="420" height="62" rx="10" fill="#edf5fa" stroke="#51788e" stroke-width="1.5" /><text x="380.0" y="451" class="" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="19">結合行動＋ゲーム内乱数 → 次状態</text><text x="30" y="528" class="small" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">省略：速度・優先度・途中の通知・追加の選択要求</text><text x="30" y="554" class="small" text-anchor="start" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#173752" font-size="16">技の処理順序と、行動を決めるときの情報条件は別。</text></svg>
