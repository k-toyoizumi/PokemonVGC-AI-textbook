<svg xmlns="http://www.w3.org/2000/svg" width="760" height="534" viewBox="0 0 760 534" role="img"><title>教師の分布と、自分が作る分布</title><rect width="100%" height="100%" fill="white"/><text x="25" y="38" font-size="24" fill="#173752" font-family="sans-serif">教師の分布と、自分が作る分布</text><rect x="35" y="70" width="690" height="62" rx="10" fill="#edf5fa" stroke="#51788e"/><text x="60" y="108" font-size="21" font-family="sans-serif" fill="#173752">教師の判断 → 教師が訪れる局面 → ログへ保存</text><path d="M380 134v26l-6 -8m6 8l6 -8" fill="none" stroke="#51788e" stroke-width="2"/><rect x="35" y="166" width="690" height="62" rx="10" fill="#edf5fa" stroke="#51788e"/><text x="60" y="204" font-size="21" font-family="sans-serif" fill="#173752">行動模倣 → 自分の方策を作る</text><path d="M380 230v26l-6 -8m6 8l6 -8" fill="none" stroke="#51788e" stroke-width="2"/><rect x="35" y="262" width="690" height="62" rx="10" fill="#edf5fa" stroke="#51788e"/><text x="60" y="300" font-size="21" font-family="sans-serif" fill="#173752">自分の行動 → 教師と異なる局面を訪れることがある</text><path d="M380 326v26l-6 -8m6 8l6 -8" fill="none" stroke="#51788e" stroke-width="2"/><rect x="35" y="358" width="690" height="62" rx="10" fill="#edf5fa" stroke="#51788e"/><text x="60" y="396" font-size="21" font-family="sans-serif" fill="#173752">未知局面で判断 → さらに分布が変わる可能性</text><text x="25" y="514" font-size="16" font-family="sans-serif" fill="#173752">模式図：訪問確率・回復の可能性は省略。誤りが必ず続くとは限らない。</text></svg>